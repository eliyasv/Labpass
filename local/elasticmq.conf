# Local SQS-compatible service: the relay publishes here and the Python consumer
# reads confirmations. AWS deployments use Amazon SQS and a Lambda consumer.
include classpath("application.conf")

# Listen on the Compose network; this port is not published to the host.
node-address { protocol = http, host = "*", port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0" }

# Compose mounts /data as a named volume so queued messages survive restarts.
messages-storage { enabled = true }
queues {
  labpass-confirmations {
    # Received messages stay hidden during processing; an undeleted message can retry.
    defaultVisibilityTimeout = 120 seconds
    # Long-poll briefly instead of returning immediately when the queue is empty.
    receiveMessageWait = 2 seconds
    # Repeatedly unsuccessful messages move aside rather than retrying indefinitely.
    deadLettersQueue { name = "labpass-confirmations-dlq", maxReceiveCount = 5 }
  }
  # Retain failed messages for inspection and controlled replay.
  labpass-confirmations-dlq { }
}
