# Compose frontend: static React files plus same-origin API forwarding.
# AWS serves these frontend assets from private S3 through CloudFront instead.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    # Refresh Docker DNS so a replaced API container can acquire a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # The container runs without root and needs writable temporary paths under /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        set $api_upstream http://api:8000;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        # Preserve API paths and the browser Host/Origin; avoid replaying mutations.
        location /api/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_cache off;
            proxy_next_upstream off;
        }
        # Swagger has its own CDN assets; API docs remain an operator interface.
        location ~ ^/(docs|redoc|openapi.json)(/|$) {
            proxy_pass $api_upstream;
            proxy_set_header Host $http_host;
            proxy_next_upstream off;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }
        # Frontend navigation falls back to index.html; API errors use their own location.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        }
    }
}
