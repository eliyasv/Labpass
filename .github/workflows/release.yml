name: Release

# Manually release an existing foundation from the current dev commit.
on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so plans, migrations and fleet refreshes cannot overlap.
concurrency:
  group: labpass-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  WORKLOAD_NAME_PREFIX: ${{ vars.WORKLOAD_NAME_PREFIX }}
  AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: 'true'
  AWS_PAGER: ''
  GH_TOKEN: ${{ github.token }}
  TF_IN_AUTOMATION: 'true'

jobs:
  # Verify the commit and all three environments' reviewer/branch rules before AWS access.
  preflight:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - name: Check release commit and existing environment protections
        run: .venv/bin/python scripts/ci/release.py preflight

  # Run CI here so image and frontend artifacts belong to this release run.
  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # GitHub environment rules gate this job; OIDC supplies a separate publishing role.
  publish:
    needs: [preflight, verify]
    if: github.ref == 'refs/heads/dev'
    environment: labpass-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      api_digest: ${{ steps.publish.outputs.api_digest }}
      lambda_digest: ${{ steps.publish.outputs.lambda_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      # Reuse the images scanned by verify; rebuilding would invalidate that evidence.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/release-images
          merge-multiple: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: labpass-publish-${{ github.run_id }}
          unset-current-credentials: true
      - id: publish
        name: Publish the scanned images without rebuilding
        env:
          RELEASE_BUNDLE: ${{ runner.temp }}/release-images
        run: .venv/bin/python scripts/ci/release.py publish

  # Permit only existing runtime updates and store the saved plan in private S3.
  # Plans contain sensitive inputs; pass version IDs and a checksum through job outputs.
  plan:
    needs: publish
    if: github.ref == 'refs/heads/dev'
    environment: labpass-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_version: ${{ steps.plan.outputs.plan_version }}
      manifest_version: ${{ steps.plan.outputs.manifest_version }}
      manifest_hash: ${{ steps.plan.outputs.manifest_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: labpass-plan-${{ github.run_id }}
          unset-current-credentials: true
      - id: plan
        name: Save and restrict the runtime update plan
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          FOUNDATION_TFVARS_JSON: ${{ vars.FOUNDATION_TFVARS_JSON }}
          ORIGIN_VERIFY_TOKEN: ${{ secrets.ORIGIN_VERIFY_TOKEN }}
          ORIGIN_VERIFY_PREVIOUS_TOKEN: ${{ secrets.ORIGIN_VERIFY_PREVIOUS_TOKEN }}
          API_DIGEST: ${{ needs.publish.outputs.api_digest }}
          LAMBDA_DIGEST: ${{ needs.publish.outputs.lambda_digest }}
        run: .venv/bin/python scripts/ci/release.py plan

  # After environment approval, verify the saved plan, migrate, roll out and check health.
  # The apply role is acquired inside this job, after its protection rules pass.
  apply:
    needs: [publish, plan]
    if: github.ref == 'refs/heads/dev'
    environment: labpass-apply
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: labpass-apply-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Apply the approved plan and verify the rollout
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          FOUNDATION_TFVARS_JSON: ${{ vars.FOUNDATION_TFVARS_JSON }}
          ORIGIN_VERIFY_TOKEN: ${{ secrets.ORIGIN_VERIFY_TOKEN }}
          ORIGIN_VERIFY_PREVIOUS_TOKEN: ${{ secrets.ORIGIN_VERIFY_PREVIOUS_TOKEN }}
          API_DIGEST: ${{ needs.publish.outputs.api_digest }}
          LAMBDA_DIGEST: ${{ needs.publish.outputs.lambda_digest }}
          PLAN_VERSION: ${{ needs.plan.outputs.plan_version }}
          MANIFEST_VERSION: ${{ needs.plan.outputs.manifest_version }}
          MANIFEST_HASH: ${{ needs.plan.outputs.manifest_hash }}
          MIGRATION_INSTANCE_ID: ${{ vars.MIGRATION_INSTANCE_ID }}
          FRONTEND_BUNDLE: ${{ runner.temp }}/frontend-dist
        run: .venv/bin/python scripts/ci/release.py apply
